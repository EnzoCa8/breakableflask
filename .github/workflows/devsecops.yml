name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Contrôle des dépendances (requirements.txt) avec Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: requirements.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'        # le job échoue si une vulnérabilité est trouvée
          format: table

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances          # ne s'exécute que si Dependances est OK
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Contrôle du Dockerfile avec Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config     # analyse des mauvaises configurations (IaC / Dockerfile)
          scan-ref: .
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          format: table

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
